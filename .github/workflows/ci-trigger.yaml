name: Microservices Trigger CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/ci-trigger.yaml"
      - ".github/workflows/microservice-ci.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build cartservice image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microservices-demo/cartservice:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --file "./src/cartservice/src/Dockerfile" \
            --tag "$IMAGE_NAME" \
            "./src/cartservice/src"

      - name: Scan cartservice image with Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/microservices-demo/cartservice:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Push cartservice image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microservices-demo/cartservice:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME"
