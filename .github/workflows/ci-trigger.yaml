name: Microservices Trigger CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/ci-trigger.yaml"
      - ".github/workflows/microservice-ci.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cartservice
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microservices-demo/cartservice:sha-${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          DOCKERFILE="./src/cartservice/src/Dockerfile"
          BUILD_CONTEXT="./src/cartservice/src"

          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::Dockerfile not found: $DOCKERFILE"
            exit 1
          fi

          docker build \
            --file "$DOCKERFILE" \
            --tag "$IMAGE_NAME" \
            "$BUILD_CONTEXT"

          docker push "$IMAGE_NAME"
