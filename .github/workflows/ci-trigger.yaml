name: Microservices Trigger CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/ci-trigger.yaml"
      - ".github/workflows/microservice-ci.yaml"

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            SERVICES=$(find src -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -u | jq -R -s -c 'split("\n")[:-1]')
          else
            SERVICES=$(git diff --name-only "$BEFORE" "$AFTER" \
              | grep '^src/' \
              | cut -d'/' -f2 \
              | sort -u \
              | jq -R -s -c 'split("\n")[:-1]' || true)

            if [ -z "$SERVICES" ]; then
              SERVICES='[]'
            fi
          fi

          echo "Detected services: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    uses: ./.github/workflows/microservice-ci.yaml
    with:
      service: ${{ matrix.service }}
