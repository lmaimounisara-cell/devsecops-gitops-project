```yaml
name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/microservices-demo/${{ inputs.service }}:sha-${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.service }}" = "cartservice" ]; then
            DOCKERFILE="./src/cartservice/src/Dockerfile"
            BUILD_CONTEXT="./src/cartservice"
          else
            DOCKERFILE="./src/${{ inputs.service }}/Dockerfile"
            BUILD_CONTEXT="./src/${{ inputs.service }}"
          fi

          echo "Building service: ${{ inputs.service }}"
          echo "Using Dockerfile: $DOCKERFILE"
          echo "Using build context: $BUILD_CONTEXT"

          if [ ! -f "$DOCKERFILE" ]; then
            echo "::error::Dockerfile not found: $DOCKERFILE"
            exit 1
          fi

          if [ ! -d "$BUILD_CONTEXT" ]; then
            echo "::error::Build context not found: $BUILD_CONTEXT"
            exit 1
          fi

          docker build \
            --file "$DOCKERFILE" \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            --tag "$IMAGE_NAME" \
            "$BUILD_CONTEXT"

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Push Image
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME"
```
